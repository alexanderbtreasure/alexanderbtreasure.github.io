<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Alex Treasure Personal Website" />
    <!-- for google search console verification -->
    <meta name="google-site-verification" content="aMMa7v_ttP8BNmbheulvXY122-TLlatO2j8Udl279k4" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      Hero background (the LCP element), handled here rather than in App.css.

      This app renders client-side, so no .bgportrait element exists until the JS
      bundle has downloaded, parsed and mounted — a background declared in App.css
      therefore can't even begin downloading until after all of that. These
      preloads start the fetch during HTML parse instead, well before React boots.

      Preloading needs a URL that's stable at build time, which the hashed src/
      asset pipeline can't give us, so this one photo lives in public/backgrounds/
      and its rule is inlined below (css-loader would try to resolve a root-
      relative url() as a module). Everything else stays in src/assets/backgrounds.

      The media attributes mirror the 1280px tier breakpoint in App.css so only
      one tier is ever fetched, and type="image/webp" makes browsers without WebP
      support skip the preload and pick up the JPEG fallback from the rule below.
    -->
    <link rel="preload" as="image" type="image/webp" media="(max-width: 1280px)"
          href="%PUBLIC_URL%/backgrounds/img_intro-sm.webp" />
    <link rel="preload" as="image" type="image/webp" media="(min-width: 1281px)"
          href="%PUBLIC_URL%/backgrounds/img_intro-lg.webp" />
    <style>
      .bgportrait {
        background-image: url("%PUBLIC_URL%/backgrounds/img_intro-sm.jpg");
        background-image: image-set(
          url("%PUBLIC_URL%/backgrounds/img_intro-sm.webp") type("image/webp"),
          url("%PUBLIC_URL%/backgrounds/img_intro-sm.jpg") type("image/jpeg")
        );
      }
      @media only screen and (min-width: 1281px) {
        .bgportrait {
          background-image: url("%PUBLIC_URL%/backgrounds/img_intro-lg.jpg");
          background-image: image-set(
            url("%PUBLIC_URL%/backgrounds/img_intro-lg.webp") type("image/webp"),
            url("%PUBLIC_URL%/backgrounds/img_intro-lg.jpg") type("image/jpeg")
          );
        }
      }
    </style>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Alex Treasure — Software Engineer, Policy Researcher, Data Expert</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

    -->
  </body>
</html>
